# Arquivo base do Docker Compose. Use sempre com um override e o .env do ambiente:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml  --env-file .env.dev  up -d
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod up -d

services:
  mysql-db:
    image: mysql:8.0-debian
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD no .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ecommerce_db}
      MYSQL_USER: ${MYSQL_USER:?defina MYSQL_USER no .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?defina MYSQL_PASSWORD no .env}
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # 127.0.0.1 força TCP: durante o init.sql o servidor temporário só escuta no socket,
      # então o banco só fica "healthy" quando o servidor definitivo sobe na 3306
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      timeout: 5s
      retries: 12
      start_period: 30s
      interval: 10s

  lojas-service:
    restart: unless-stopped
    environment:
      DB_HOST: mysql-db
      DB_USER: ${MYSQL_USER:?defina MYSQL_USER no .env}
      DB_PASSWORD: ${MYSQL_PASSWORD:?defina MYSQL_PASSWORD no .env}
      DB_NAME: ${MYSQL_DATABASE:-ecommerce_db}
    ports:
      - "${APP_PORT:-8484}:8484"
    depends_on:
      mysql-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8484/status')"]
      timeout: 10s
      retries: 5
      start_period: 30s
      interval: 30s
