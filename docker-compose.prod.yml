# Override de PRODUÇÃO: imagem versionada do Docker Hub, MySQL sem porta publicada.
# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod up -d

services:
  mysql-db:
    volumes:
      - mysql_data_prod:/var/lib/mysql
    networks:
      - prod-network
    security_opt:
      - no-new-privileges:true
    user: mysql

  lojas-service:
    image: ${DOCKER_HUB_USER:-local}/lojas-service:${IMAGE_TAG:-v1.0.1}
    build:
      context: ./lojas-service
      dockerfile: dockerfile
    networks:
      - prod-network
    security_opt:
      - no-new-privileges:true
    environment:
      FLASK_ENV: production
      FLASK_DEBUG: "false"

volumes:
  mysql_data_prod:
    name: ecommerce_prod_mysql_data

networks:
  prod-network:
    driver: bridge
    name: ecommerce_prod_network
