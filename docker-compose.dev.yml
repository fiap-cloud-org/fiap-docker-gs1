# Override de DESENVOLVIMENTO: build local com hot reload, MySQL exposto só no localhost.
# Uso: docker compose -f docker-compose.yml -f docker-compose.dev.yml --env-file .env.dev up -d

services:
  mysql-db:
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3308}:3306"
    volumes:
      - mysql_data_dev:/var/lib/mysql
    networks:
      - dev-network

  lojas-service:
    build:
      context: ./lojas-service
      dockerfile: dockerfile.dev
    volumes:
      # Código montado para hot reload
      - ./lojas-service:/app:ro
    networks:
      - dev-network
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: "true"

volumes:
  mysql_data_dev:
    name: ecommerce_dev_mysql_data

networks:
  dev-network:
    driver: bridge
    name: ecommerce_dev_network
